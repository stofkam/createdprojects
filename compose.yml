services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  back:
    build: ./back
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Обратите внимание: вместо localhost используется имя сервиса 'db'
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

  front:
    build: ./front
    restart: always
    ports:
      - "80:80"
    depends_on:
      - back

volumes:
  pgdata:
